# Render Blueprint — https://docs.render.com/blueprint-spec
# Deploy: connect this repo on render.com → New → Blueprint

databases:
  - name: salembeauty-db
    plan: free
    databaseName: salembeauty
    user: salembeauty

services:
  - type: web
    name: salembeauty
    runtime: node
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build &&
      cd ../backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "3000"
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: api
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DB_LOGGING
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "15m"
      - key: JWT_REFRESH_EXPIRATION
        value: "7d"
      - key: DATABASE_URL
        fromDatabase:
          name: salembeauty-db
          property: connectionString
